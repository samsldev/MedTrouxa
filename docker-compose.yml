# MedTrouxa - DESENVOLVIMENTO (para produção use docker-compose.prod.yml)
# Postgres HA: 1 primário (pg-0) + 2 réplicas streaming (pg-1, pg-2) gerenciadas pelo repmgr.
# Se o primário cair, o repmgr promove uma réplica automaticamente; quando o antigo
# primário volta, ele se reintegra ao cluster como réplica do novo primário.
# O Pgpool-II fica na frente: descobre sozinho quem é o primário (escritas) e
# balanceia as leituras entre as réplicas. O backend só conhece o pgpool.

x-pg-common: &pg-common
  image: bitnamilegacy/postgresql-repmgr:17
  restart: unless-stopped
  # /tmp em memória: evita PID file velho do repmgrd travar o nó após um restart do container
  tmpfs: [/tmp]
  healthcheck:
    test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRESQL_PASSWORD pg_isready -U $$POSTGRESQL_USERNAME -d $$POSTGRESQL_DATABASE -h 127.0.0.1"]
    interval: 10s
    timeout: 5s
    retries: 10

x-pg-env: &pg-env
  POSTGRESQL_POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:-adminpass}
  POSTGRESQL_USERNAME: ${DB_USER:-medtrouxa}
  POSTGRESQL_PASSWORD: ${DB_PASSWORD:-medtrouxa}
  POSTGRESQL_DATABASE: ${DB_NAME:-medtrouxa}
  REPMGR_PASSWORD: ${REPMGR_PASSWORD:-repmgrpass}
  REPMGR_PRIMARY_HOST: pg-0
  REPMGR_PARTNER_NODES: pg-0,pg-1,pg-2
  REPMGR_FAILOVER: automatic
  REPMGR_DEGRADED_MONITORING_TIMEOUT: "5"
  REPMGR_RECONNECT_ATTEMPTS: "3"
  REPMGR_RECONNECT_INTERVAL: "5"

# Nome fixo: volumes de desenvolvimento separados dos de produção (docker-compose.prod.yml usa medtrouxa-prod)
name: medtrouxa-dev

services:
  pg-0:
    <<: *pg-common
    volumes: [pg0_data:/bitnami/postgresql]
    environment:
      <<: *pg-env
      REPMGR_NODE_NAME: pg-0
      REPMGR_NODE_NETWORK_NAME: pg-0

  pg-1:
    <<: *pg-common
    volumes: [pg1_data:/bitnami/postgresql]
    environment:
      <<: *pg-env
      REPMGR_NODE_NAME: pg-1
      REPMGR_NODE_NETWORK_NAME: pg-1

  pg-2:
    <<: *pg-common
    volumes: [pg2_data:/bitnami/postgresql]
    environment:
      <<: *pg-env
      REPMGR_NODE_NAME: pg-2
      REPMGR_NODE_NETWORK_NAME: pg-2

  pgpool:
    image: bitnamilegacy/pgpool:4
    restart: unless-stopped
    ports: ["5432:5432"]
    depends_on: [pg-0, pg-1, pg-2]
    environment:
      PGPOOL_BACKEND_NODES: 0:pg-0:5432,1:pg-1:5432,2:pg-2:5432
      PGPOOL_BACKEND_APPLICATION_NAMES: pg-0,pg-1,pg-2
      PGPOOL_SR_CHECK_USER: repmgr
      PGPOOL_SR_CHECK_PASSWORD: ${REPMGR_PASSWORD:-repmgrpass}
      PGPOOL_SR_CHECK_DATABASE: postgres
      PGPOOL_ENABLE_LDAP: "no"
      PGPOOL_POSTGRES_USERNAME: postgres
      PGPOOL_POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:-adminpass}
      PGPOOL_POSTGRES_CUSTOM_USERS: ${DB_USER:-medtrouxa}
      PGPOOL_POSTGRES_CUSTOM_PASSWORDS: ${DB_PASSWORD:-medtrouxa}
      PGPOOL_ADMIN_USERNAME: admin
      PGPOOL_ADMIN_PASSWORD: ${PGPOOL_ADMIN_PASSWORD:-pgpooladmin}
      PGPOOL_ENABLE_LOAD_BALANCING: "yes"
      PGPOOL_AUTO_FAILBACK: "yes"
    healthcheck:
      test: ["CMD", "/opt/bitnami/scripts/pgpool/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-devredis}"]
    ports: ["6379:6379"]
    volumes: [redis_data:/data]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      pgpool: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      # A imagem do backend vem com NODE_ENV=production; sem isto o backend de dev roda em modo produção,
      # recusa as senhas de desenvolvimento e fica reiniciando em loop.
      NODE_ENV: development
      PORT: 3000
      DB_HOST: pgpool
      DB_PORT: 5432
      DB_USER: ${DB_USER:-medtrouxa}
      DB_PASSWORD: ${DB_PASSWORD:-medtrouxa}
      DB_NAME: ${DB_NAME:-medtrouxa}
      # Depoimentos de EXEMPLO na landing (só fora de produção). Em produção: NODE_ENV=production
      DEMO_CONTENT: ${DEMO_CONTENT:-true}
      REDIS_URL: redis://:${REDIS_PASSWORD:-devredis}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-not-for-production-use-000}
      APP_URL: http://localhost:5173
      PAYMENT_PROVIDER: fake
      # NFS-e em modo de simulação (sem certificado, sem valor fiscal). Em produção: NFSE_ENABLED=1
      NFSE_ENABLED: ${NFSE_ENABLED:-simulate}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["3000:3000"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on: [backend]
    ports: ["5173:8080"]

volumes:
  pg0_data:
  pg1_data:
  pg2_data:
  redis_data:
